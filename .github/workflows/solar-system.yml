name: Solar System Workflow
on:
    workflow_dispatch: 
    push: 
        branches: ['main','feature/*']


jobs:
    Unit-Testing:
        name: Unit-Testing
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Node Install
              uses: actions/setup-node@v3
              with:
                node-version: 18

            - name: Install dependence
              run: npm install
              
            - name: Unit Testing
              run: npm test